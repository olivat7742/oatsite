<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matmut – Code de sécurité</title>
  <style>
    :root {
      --navy: #000069;
      --blue: #0391DF;
      --pink: #F42A5F;
      --bg: #F3F5FB;
      --text: #1A1A4D;
      --muted: #5F6389;
      --line: #D9DDEC;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at 12% 8%, rgba(3,145,223,.12), transparent 40%),
        radial-gradient(circle at 92% 95%, rgba(244,42,95,.08), transparent 38%),
        var(--bg);
    }
    [hidden] { display: none !important; }
    .logo { display: block; width: 200px; max-width: 70%; height: auto; margin: 0 auto 24px; }
    .frame {
      background: #fff;
      border-radius: 20px;
      padding: 32px 32px 28px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      border-top: 5px solid var(--navy);
      box-shadow: 0 10px 40px rgba(0,0,105,.12);
    }
    h1 { margin: 0 0 6px; font-size: 20px; color: var(--navy); font-weight: 700; }
    .sub { margin: 0 0 18px; font-size: 14px; color: var(--muted); }
    .code {
      font-family: "Consolas", "Courier New", monospace;
      font-size: 52px;
      font-weight: bold;
      letter-spacing: 6px;
      color: var(--navy);
      background: var(--bg);
      border-radius: 12px;
      padding: 14px 8px;
      user-select: all;
      cursor: pointer;
      white-space: nowrap;
    }
    .bar { height: 6px; background: var(--line); border-radius: 3px; margin: 20px 0 8px; overflow: hidden; }
    .bar > div { height: 100%; background: linear-gradient(90deg, var(--blue), var(--navy)); transition: width 1s linear; }
    .timer { font-size: 14px; color: var(--muted); }
    .msg { font-size: 13px; margin-top: 10px; min-height: 1em; color: var(--pink); }
    #msg { color: var(--blue); }
    input, textarea, button {
      font: inherit;
      width: 100%;
      margin-top: 12px;
      border-radius: 10px;
      padding: 12px 14px;
    }
    input, textarea { color: var(--text); background: #fff; border: 1px solid var(--line); }
    input:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(3,145,223,.2); }
    textarea { font-family: "Consolas", "Courier New", monospace; font-size: 12px; height: 110px; resize: vertical; }
    button {
      cursor: pointer; font-weight: 600;
      color: #fff; background: var(--navy); border: 1px solid var(--navy);
      border-radius: 999px;
      transition: background .15s, transform .05s;
    }
    button:hover:not(:disabled) { background: #1a1a8c; }
    button:active:not(:disabled) { transform: scale(.98); }
    button:disabled { opacity: .5; cursor: wait; }
    button.link {
      background: none; border: none; color: var(--navy);
      width: auto; padding: 4px 8px; margin-top: 14px;
      font-weight: 500; font-size: 13px; text-decoration: underline;
    }
    button.link:hover:not(:disabled) { background: none; color: var(--blue); }
    .hint { font-size: 12px; color: var(--muted); text-align: left; margin-top: 14px; line-height: 1.5; }
    .foot { margin-top: 20px; font-size: 12px; color: var(--muted); }
  </style>
</head>

  <div class="frame">
    <h1>Votre code de sécurité</h1>
    <p class="sub">Cliquez sur le code pour le copier.</p>
    <div class="code" id="code" title="Cliquer pour copier">--- ---</div>
    <div class="bar"><div id="bar" style="width:100%"></div></div>
    <div class="timer" id="timer">-- s restantes</div>
    <div class="msg" id="msg" style="color:var(--blue)"></div>
  </div>
  <div class="foot">Matmut · Accès protégé</div>
  <script>
    const SECRET = "Y2DAUFH4FKWDBNKN";
    const DIGITS = 6, PERIOD = 30, ALGORITHM = "SHA-1";
    const $ = id => document.getElementById(id);

    function base32Decode(input) {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
      let bits = 0, value = 0;
      const out = [];
      for (const ch of input.toUpperCase().replace(/[\s=-]/g, "")) {
        const idx = alphabet.indexOf(ch);
        if (idx === -1) throw new Error("Invalid Base32 character: " + ch);
        value = (value << 5) | idx;
        bits += 5;
        if (bits >= 8) { out.push((value >>> (bits - 8)) & 0xff); bits -= 8; }
      }
      return new Uint8Array(out);
    }

    async function generateTOTP(secret, counter) {
      const key = await crypto.subtle.importKey("raw", base32Decode(secret), { name: "HMAC", hash: ALGORITHM }, false, ["sign"]);
      const msg = new ArrayBuffer(8);
      const view = new DataView(msg);
      view.setUint32(0, Math.floor(counter / 2 ** 32));
      view.setUint32(4, counter >>> 0);
      const hmac = new Uint8Array(await crypto.subtle.sign("HMAC", key, msg));
      const offset = hmac[hmac.length - 1] & 0x0f;
      const bin = ((hmac[offset] & 0x7f) << 24) | (hmac[offset + 1] << 16) | (hmac[offset + 2] << 8) | hmac[offset + 3];
      return (bin % 10 ** DIGITS).toString().padStart(DIGITS, "0");
    }

    let lastCounter = null;
    async function tick() {
      const now = Date.now() / 1000;
      const counter = Math.floor(now / PERIOD);
      const remaining = Math.ceil(PERIOD - (now % PERIOD));
      $("timer").textContent = remaining + " s restantes";
      $("bar").style.width = (remaining / PERIOD * 100) + "%";
      if (counter !== lastCounter) {
        lastCounter = counter;
        const code = await generateTOTP(SECRET, counter);
        $("code").textContent = code.slice(0, 3) + " " + code.slice(3);
      }
    }

    $("code").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText($("code").textContent.replace(/\s/g, ""));
        $("msg").textContent = "Copié !";
        setTimeout(() => ($("msg").textContent = ""), 1500);
      } catch {}
    });

    if (!window.isSecureContext || !crypto.subtle) {
      $("msg").textContent = "Ouvrez cette page en HTTPS ou comme fichier local.";
    } else {
      tick();
      setInterval(tick, 1000);
    }
  </script>
